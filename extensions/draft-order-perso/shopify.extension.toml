api_version = "2025-10"
[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "draft-order-perso"
type = "ui_extension"
uid = "00af77c5-33b4-a278-2c87-906d2c0d9b3969485c06"

# Formulário de personalização como Admin Action (modal via "Mais ações"):
# tem Save fixo e rolagem própria — não corta como o block.
[[extensions.targeting]]
module = "./src/ActionExtension.jsx"
target = "admin.draft-order-details.action.render"


